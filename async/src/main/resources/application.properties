spring.application.name=async
server.port=8080

# The trace id is put in the MDC by TraceIdFilter and copied into the worker threads by the task
# decorator, so async log lines can be tied back to the request that started them.
logging.pattern.level=%5p [%X{traceId:-no-trace}]
logging.level.com.example=DEBUG

# How long Spring MVC waits for a controller that returned a CompletableFuture before it gives up
# on the request. The default is the container's, which is easy to hit with slow demo tasks.
spring.mvc.async.request-timeout=60s
