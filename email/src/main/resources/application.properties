spring.application.name=email

# MailHog for local development: it accepts everything and delivers nothing.
# It runs in the docker compose stack on the host, while this application runs inside the
# devcontainer, so the host is addressed through the docker bridge gateway rather than
# localhost (same as the redis host in the cache-redis module).
# Sent mail shows up in its web UI at http://localhost:8025 from the host.
spring.mail.host=${MAIL_HOST:172.17.0.1}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:dev@example.com}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.default-encoding=UTF-8

# MailHog has neither authentication nor TLS. For a real SMTP server such as
# smtp.gmail.com:587 set MAIL_HOST/MAIL_PORT/MAIL_USERNAME/MAIL_PASSWORD and turn
# these three back on (port 465 wants mail.smtp.ssl.enable=true instead of starttls).
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
spring.mail.properties.mail.smtp.starttls.required=false

spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# The module has no Thymeleaf templates yet; skip the startup warning.
spring.thymeleaf.check-template-location=false

logging.level.com.example=DEBUG
