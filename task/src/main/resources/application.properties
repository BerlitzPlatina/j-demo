spring.application.name=task

# The default scheduler has one thread, so a slow job blocks the others. With three jobs and
# two of them sleeping, a pool of 5 keeps them independent.
spring.task.scheduling.pool.size=5
spring.task.scheduling.thread-name-prefix=job-

# This module only runs jobs; it does not serve requests.
spring.main.web-application-type=none

logging.level.com.example=DEBUG
logging.pattern.console=%d{HH:mm:ss} %-5level %msg%n
