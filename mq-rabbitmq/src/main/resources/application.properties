spring.application.name=mq-rabbitmq
server.port=8080

# Reads the .env at the repository root, so the credentials below resolve without exporting
# anything into the shell first. Optional: the application still starts if the file is absent,
# and a real environment variable of the same name wins over the file.
#
# Both paths are listed because the working directory depends on how the application is launched:
# mvn spring-boot:run uses the module directory (../.env), while an IDE run configuration or a
# java -jar from the repository root uses the repository root (./.env).
spring.config.import=optional:file:./.env[.properties],optional:file:../.env[.properties]

# The broker runs in the compose stack on the host; from inside the devcontainer the host is
# reached through the docker bridge gateway, not localhost.
spring.rabbitmq.host=${RABBITMQ_HOST:172.17.0.1}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:app}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:}
spring.rabbitmq.virtual-host=${RABBITMQ_VHOST:/}

# The handlers call channel.basicAck themselves, so the container must not ack for them.
spring.rabbitmq.listener.simple.acknowledge-mode=manual

logging.level.com.example=DEBUG

# The delay queue needs the community plugin rabbitmq_delayed_message_exchange on the broker.
# Without it the exchange cannot be declared and the application will not start, so it is off
# by default. Enable once the plugin is installed.
rabbitmq.delay.enabled=${RABBITMQ_DELAY_ENABLED:false}
