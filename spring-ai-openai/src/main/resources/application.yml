server:
  port: 8080

spring:
  # Nạp .env ở thư mục module hoặc ở root repo (optional: không có file thì bỏ qua)
  config:
    import:
      - optional:file:./.env[.properties]
      - optional:file:../.env[.properties]

  datasource:
    url: jdbc:mysql://172.17.0.1:3306/appdb?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Ho_Chi_Minh
    username: root
    password: TvWS7iUUbVhlG85rO4On9zja
    driver-class-name: com.mysql.cj.jdbc.Driver
    type: com.zaxxer.hikari.HikariDataSource

    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      connection-test-query: SELECT 1
      auto-commit: true
      idle-timeout: 30000
      pool-name: SpringAiOpenaiHikariCP
      max-lifetime: 60000
      connection-timeout: 30000

  sql:
    init:
      mode: always
      schema-locations:
        - classpath:db/schema.sql
      data-locations:
        - classpath:db/data.sql
      continue-on-error: true

  ai:
    openai:
      api-key: ${GEMINI_API_KEY:}
      base-url: https://generativelanguage.googleapis.com/v1beta/openai
      chat:
        options:
          # Model thinking của Gemini đòi client gửi lại thought_signature ở lượt gọi thứ hai
          # của tool calling; Spring AI 1.x không có field này nên bị HTTP 400.
          # -> GeminiThoughtSignatureConfig chèn lại chữ ký ở tầng HTTP.
          # gemini-flash-latest hiện trỏ tới gemini-3.6-flash, free tier chỉ 20 request/ngày.
          # Dùng flash-lite để test cho thoáng quota.
          model: gemini-flash-lite-latest

logging:
  level:
    com.example.springaiopenai: debug
