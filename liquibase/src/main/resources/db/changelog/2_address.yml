databaseChangeLog:
  - changeSet:
      id: create-address
      author: nam
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: addresses
      changes:
        - createTable:
            tableName: addresses
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: organization_id
                  type: BIGINT
                  constraints:
                    nullable: false

              - column:
                  name: street_address1
                  type: VARCHAR(255)

              - column:
                  name: street_address2
                  type: VARCHAR(255)

              - column:
                  name: city
                  type: VARCHAR(100)

              - column:
                  name: state
                  type: VARCHAR(100)

              - column:
                  name: country
                  type: VARCHAR(100)

              - column:
                  name: zip
                  type: VARCHAR(20)

  - changeSet:
      id: add-address-organization-fk
      author: nam
      changes:
        - addForeignKeyConstraint:
            baseTableName: addresses
            baseColumnNames: organization_id
            referencedTableName: organizations
            referencedColumnNames: id
            constraintName: fk_organization_address_organization
