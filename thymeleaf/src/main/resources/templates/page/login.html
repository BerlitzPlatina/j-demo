<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<header th:replace="~{common/head :: header}"></header>

<body>
	<div id="app" style="margin: 20px 20%">
		<div th:if="${error}" style="color: red; margin-bottom: 10px;" th:text="${error}"></div>
		<form action="/demo/user/login" method="post">
			用户名<input type="text" name="name" placeholder="用户名" th:value="${user?.name}" />
			密码<input type="password" name="password" placeholder="密码" />
			<input type="submit" value="登录">
		</form>
	</div>
</body>

</html>
