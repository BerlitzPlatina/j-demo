spring:
  datasource:
    jdbc-url: jdbc:mysql://172.17.0.1:3306/appdb
    username: root
    password: TvWS7iUUbVhlG85rO4On9zja
    driver-class-name: com.mysql.cj.jdbc.Driver
    type: com.zaxxer.hikari.HikariDataSource

    hikari:
      minimum-idle: 5
      connection-test-query: SELECT 1
      maximum-pool-size: 20
      auto-commit: true
      idle-timeout: 30000
      pool-name: SpringBootDemoHikariCP
      max-lifetime: 60000
      connection-timeout: 30000

  sql:
    init:
      mode: always
      continue-on-error: true
      schema-locations:
        - classpath:db/schema.sql
      data-locations:
        - classpath:db/data.sql

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: validate
    open-in-view: true

logging:
  level:
    com.example: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE