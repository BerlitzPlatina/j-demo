spring:
  datasource:
    jdbc-url: jdbc:mysql://172.17.0.1:3306/appdb
    username: root
    password: TvWS7iUUbVhlG85rO4On9zja
    driver-class-name: com.mysql.cj.jdbc.Driver
    type: com.zaxxer.hikari.HikariDataSource

    hikari:
      minimum-idle: 5
      connection-test-query: SELECT 1
      maximum-pool-size: 20
      auto-commit: true
      idle-timeout: 30000
      pool-name: SpringBootDemoHikariCP
      max-lifetime: 60000
      connection-timeout: 30000
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      password: N0R3KnqHufdBOSJpjZEeKkgk
      database: 0

  sql:
    init:
      mode: always
      continue-on-error: true
      schema-locations:
        - classpath:db/schema.sql
      data-locations:
        - classpath:db/data.sql

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: validate
    # Off on purpose: with it on, a lazy relation touched during JSON serialization is loaded
    # silently, one query per row. Off, that same mistake fails loudly with
    # LazyInitializationException instead of becoming a hidden N+1 in production.
    open-in-view: false

logging:
  level:
    com.example: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE