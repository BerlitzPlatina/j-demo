spring.application.name=mq-kafka
server.port=8080

# Reads the .env at the repository root, so the settings below resolve without exporting anything
# into the shell first. Optional: the application still starts if the file is absent, and a real
# environment variable of the same name wins over the file.
#
# Both paths are listed because the working directory depends on how the application is launched:
# mvn spring-boot:run uses the module directory (../.env), while an IDE run configuration or a
# java -jar from the repository root uses the repository root (./.env).
spring.config.import=optional:file:./.env[.properties],optional:file:../.env[.properties]

# The broker runs in the compose stack on the host; from inside the devcontainer the host is
# reached through the docker bridge gateway, not localhost. 9094 is the listener advertised for
# clients outside the compose network.
spring.kafka.bootstrap-servers=${KAFKA_HOST:172.17.0.1}:${KAFKA_PORT:9094}

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
# Wait for all in-sync replicas before considering a send successful, and let the producer dedupe
# its own retries so a retry cannot duplicate a record.
spring.kafka.producer.acks=all
spring.kafka.producer.retries=3
spring.kafka.producer.properties.enable.idempotence=true
# Hold records back for a few ms so a burst is batched into fewer requests, which is what makes the
# batch listener demo receive them together.
spring.kafka.producer.properties.linger.ms=20

spring.kafka.consumer.group-id=mq-kafka-demo
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
# A brand new group starts at the beginning of the topic, so messages produced before the
# application was started are still visible in the demo.
spring.kafka.consumer.auto-offset-reset=earliest
# The listeners commit through Acknowledgment, so the client must not commit on its own.
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.max-poll-records=50

# The topics are declared as NewTopic beans; fail fast if the broker is unreachable at startup
# rather than discovering it on the first send.
spring.kafka.admin.fail-fast=true

logging.level.com.example=DEBUG
