                  UNION ALL

                  SELECT
                      'VAT15',
                      'VAT 15%',
                      15,
                      'tax',
                      'rate',
                      'vat',
                      NULL,
                      NULL,
                      TRUE,
                      132086000000107333,
                      132086000000107337,
                      132086000000107337,
                      NULL,
                      NULL,
                      NULL,
                      'single',
                      FALSE,
                      FALSE,
                      NULL,
                      '2024-01-01',
                      NULL,
                      'Standard VAT rate of 15%',
                      '2024-02-01 10:05:00'
              ) AS c
              WHERE NOT EXISTS (
                  SELECT 1
                  FROM taxes t
                  WHERE t.name = c.name
              )

      rollback:
        - delete:
            tableName: taxes
            where: >-
              name IN (
                'IGST5',
                'IGST12',
                'IGST18',
                'IGST28',
                'CGST5',
                'CGST9',
                'SGST5',
                'SGST9',
                'VAT5',
                'VAT15'
              )