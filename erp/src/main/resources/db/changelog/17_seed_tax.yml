                      'cgst',
                      'Central Board of Indirect Taxes and Customs',
                      '460000000066001',
                      FALSE,
                      132086000000107333,
                      132086000000107337,
                      132086000000107337,
                      132086000000107338,
                      132086000000107339,
                      132086000000107340,
                      'single',
                      FALSE,
                      FALSE,
                      NULL,
                      '2024-04-01',
                      '2025-03-31',
                      'Standard CGST rate of 9%',
                      '2024-01-16 09:05:00'

                  UNION ALL

