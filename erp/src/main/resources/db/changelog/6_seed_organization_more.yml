  # 5_seed_address.yml only fires while `addresses` is empty, so the organizations added above
  # would have none. This fills in whichever organizations still have no address, which covers
  # them without touching the ones already seeded.
  - changeSet:
      id: seed-addresses-for-organizations-without-any
      author: nam
      context: dev
      preConditions:
        - onFail: MARK_RAN
        - sqlCheck:
            expectedResult: 1
            sql: >
              SELECT CASE WHEN COUNT(*) > 0 THEN 1 ELSE 0 END
              FROM organizations o
              WHERE NOT EXISTS (SELECT 1 FROM addresses a WHERE a.organization_id = o.id)
      changes:
        # Same shape as 5_seed_address.yml - organizations numbered by id, mapped onto a slot
        # with a modulo so the catalog never runs out. Different cities, so it stays obvious in
        # the data which changeset produced which row. Slots 2 and 4 carry a second address, so
        # the one-to-many is visible on more than one organization.
        - sql:
            sql: >
              INSERT INTO addresses
                  (organization_id, street_address1, street_address2, city, state, country, zip)
              SELECT o.id, c.street_address1, c.street_address2, c.city, c.state, c.country, c.zip
              FROM (
                  SELECT id, ((ROW_NUMBER() OVER (ORDER BY id) - 1) % 5) + 1 AS slot
                  FROM organizations o
                  WHERE NOT EXISTS (SELECT 1 FROM addresses a WHERE a.organization_id = o.id)
              ) o
              JOIN (
                            SELECT 1 AS slot, '45 Le Duan'          AS street_address1, 'Block A'      AS street_address2, 'Da Nang'   AS city, 'Da Nang'    AS state, 'Vietnam'        AS country, '50000' AS zip
                  UNION ALL SELECT 2,         '77 Orchard Road',                        'Level 12',                        'Singapore',            'Central',                'Singapore',                 '238858'
                  UNION ALL SELECT 3,         'Maximilianstrasse 5',                    NULL,                              'Munich',               'Bavaria',                'Germany',                   '80539'
                  UNION ALL SELECT 4,         '1200 Market Street',                     'Floor 6',                         'Philadelphia',         'PA',                     'United States',             '19107'
                  UNION ALL SELECT 5,         '9 Tran Phu',                             'Suite 21',                        'Hue',                  'Thua Thien Hue',         'Vietnam',                   '49000'
                  UNION ALL SELECT 2,         '3 Changi Business Park',                 'Warehouse 1',                     'Singapore',            'East',                   'Singapore',                 '486051'
                  UNION ALL SELECT 4,         '500 Delaware Avenue',                    'Depot 3',                         'Wilmington',           'DE',                     'United States',             '19801'
              ) c ON c.slot = o.slot
      rollback:
        - delete:
            tableName: addresses
            where: >
              street_address1 IN ('45 Le Duan', '77 Orchard Road', 'Maximilianstrasse 5',
                                  '1200 Market Street', '9 Tran Phu', '3 Changi Business Park',
                                  '500 Delaware Avenue')
