databaseChangeLog:
  # `seed-organizations` in 3_seed_organization.yml only inserts into an empty table. On a
  # database that already carried an organization it was recorded as MARK_RAN, so its five rows
  # were never inserted and never will be - Liquibase considers that changeset done. This file
  # inserts them separately, guarded on the names rather than on the table being empty, so it is
  # a no-op on a database where the original seed did run.
  - changeSet:
      id: seed-organizations-missed
      author: nam
      context: dev
      preConditions:
        - onFail: MARK_RAN
        - sqlCheck:
            expectedResult: 0
            sql: >
              SELECT COUNT(*) FROM organizations
              WHERE name IN ('Acme Manufacturing', 'Bluewave Logistics', 'Cedar Retail Group',
                             'Delta Health Services', 'Everline Software')
      changes:
        # Every row goes in with is_default_org = false on purpose. The original seed gave the
        # flag to Acme, but by now another organization already holds it, and the service treats
        # "exactly one default" as an invariant. Moving the flag is a business decision, not
        # something a seed should do behind the caller's back.
        - insert:
            tableName: organizations
            columns:
              - column: { name: name, value: "Acme Manufacturing" }
              - column: { name: is_logo_uploaded, valueBoolean: true }
              - column: { name: is_default_org, valueBoolean: false }
              - column: { name: user_role, value: "OWNER" }
              - column: { name: account_created_date, valueDate: "2024-01-15" }
              - column: { name: time_zone, value: "Asia/Ho_Chi_Minh" }
              - column: { name: language_code, value: "en" }
              - column: { name: date_format, value: "dd/MM/yyyy" }
              - column: { name: field_separator, value: "/" }
              - column: { name: fiscal_year_start_month, valueNumeric: 1 }
              - column: { name: tax_group_enabled, valueBoolean: true }
              - column: { name: user_status, value: "ACTIVE" }
              - column: { name: contact_name, value: "Nguyen Van An" }
              - column: { name: industry_type, value: "MANUFACTURING" }
