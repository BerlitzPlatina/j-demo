databaseChangeLog:
  - changeSet:
      id: seed-organizations
      author: nam
      # Development seed data. Runs once and only against an empty table, so a database that
      # already carries real organizations is left alone.
      context: dev
      preConditions:
        - onFail: MARK_RAN
        - sqlCheck:
            expectedResult: 0
            sql: SELECT COUNT(*) FROM organizations
      changes:
        - insert:
            tableName: organizations
            columns:
              - column: { name: name, value: "Acme Manufacturing" }
              - column: { name: is_logo_uploaded, valueBoolean: true }
              # Exactly one seeded row holds the default flag; the service moves it from here on.
              - column: { name: is_default_org, valueBoolean: true }
              - column: { name: user_role, value: "OWNER" }
              - column: { name: account_created_date, valueDate: "2024-01-15" }
              - column: { name: time_zone, value: "Asia/Ho_Chi_Minh" }
              - column: { name: language_code, value: "en" }
              - column: { name: date_format, value: "dd/MM/yyyy" }
              - column: { name: field_separator, value: "/" }
              - column: { name: fiscal_year_start_month, valueNumeric: 1 }
              - column: { name: tax_group_enabled, valueBoolean: true }
              - column: { name: user_status, value: "ACTIVE" }
              - column: { name: contact_name, value: "Nguyen Van An" }
              - column: { name: industry_type, value: "MANUFACTURING" }
              - column: { name: create_time, valueDate: "2024-01-15T08:00:00" }
              - column: { name: last_update_time, valueDate: "2024-01-15T08:00:00" }

        - insert:
            tableName: organizations
            columns:
              - column: { name: name, value: "Bluewave Logistics" }
              - column: { name: is_logo_uploaded, valueBoolean: false }
              - column: { name: is_default_org, valueBoolean: false }
