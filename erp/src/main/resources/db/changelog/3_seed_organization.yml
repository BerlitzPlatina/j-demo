              - column: { name: field_separator, value: "-" }
              - column: { name: fiscal_year_start_month, valueNumeric: 4 }
              - column: { name: tax_group_enabled, valueBoolean: false }
              - column: { name: user_status, value: "ACTIVE" }
              - column: { name: contact_name, value: "Tran Thi Mai" }
