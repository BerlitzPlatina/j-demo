databaseChangeLog:
  - changeSet:
      id: create-position
      author: nam
      changes:
        - createTable:
            tableName: positions
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: legal_entity_id
                  type: BIGINT
                  constraints:
                    nullable: false

              - column:
                  name: job_id
                  type: BIGINT

              - column:
                  name: legacy_position_id
                  type: INT
                  constraints:
                    nullable: false
                    unique: true

              - column:
                  name: position_code
                  type: VARCHAR(32)
                  constraints:
                    nullable: false

              - column:
                  name: legacy_position_code
                  type: VARCHAR(20)

              - column:
                  name: position_name
                  type: TEXT
                  constraints:
                    nullable: false

              - column:
                  name: position_status
                  type: VARCHAR(16)
                  constraints:
                    nullable: false

              - column:
                  name: reference_quality
                  type: VARCHAR(32)
                  constraints:
                    nullable: false

              - column:
                  name: source
                  type: VARCHAR(32)
                  constraints:
                    nullable: false

              # Backs AbstractAuditModel from the common-jpa jar; JPA auditing fills both in.
              - column:
                  name: created_at
                  type: DATETIME
                  constraints:
                    nullable: false

              - column:
                  name: updated_at
                  type: DATETIME
                  constraints:
                    nullable: false

  - changeSet:
      id: add-position-legal_entity-fk
      author: nam
      changes:
        - addForeignKeyConstraint:
            baseTableName: positions
            baseColumnNames: legal_entity_id
            referencedTableName: legal_entities
            referencedColumnNames: id
            constraintName: fk_position_legal_entity

  - changeSet:
      id: add-position-job-fk
      author: nam
      changes:
        - addForeignKeyConstraint:
            baseTableName: positions
            baseColumnNames: job_id
            referencedTableName: jobs
            referencedColumnNames: id
            constraintName: fk_position_job
