databaseChangeLog:
  - changeSet:
      id: create-job
      author: nam
      changes:
        - createTable:
            tableName: jobs
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: legal_entity_id_id
                  type: BIGINT
                  constraints:
                    nullable: false

              - column:
                  name: job_code
                  type: VARCHAR(32)
                  constraints:
                    nullable: false

              - column:
                  name: job_name
                  type: VARCHAR(120)
                  constraints:
                    nullable: false

              - column:
                  name: job_status
                  type: VARCHAR(16)
                  constraints:
                    nullable: false

              - column:
                  name: reference_quality
                  type: VARCHAR(32)
                  constraints:
                    nullable: false

              - column:
                  name: source
                  type: VARCHAR(32)
                  constraints:
                    nullable: false

              - column:
                  name: created_by
                  type: INT
                  constraints:
                    nullable: false

              - column:
                  name: updated_by
                  type: INT

              # Backs AbstractAuditModel from the common-jpa jar; JPA auditing fills both in.
              - column:
                  name: created_at
                  type: DATETIME
                  constraints:
                    nullable: false

              - column:
                  name: updated_at
                  type: DATETIME
                  constraints:
                    nullable: false

  - changeSet:
      id: add-job-legal_entity_id-fk
      author: nam
      changes:
        - addForeignKeyConstraint:
            baseTableName: jobs
            baseColumnNames: legal_entity_id_id
            referencedTableName: legal_entities
            referencedColumnNames: id
            constraintName: fk_job_legal_entity_id
