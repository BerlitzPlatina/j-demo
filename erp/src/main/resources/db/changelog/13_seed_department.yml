databaseChangeLog:
  # Development seed data for the department module.
  #
  # `departments` is a root table: it has no organization_id and no foreign key, so there is
  # nothing to join against and the catalog is inserted as a flat list.
  #
  # The guard is the NOT EXISTS on department_code, the business key this file owns, rather than
  # a "table is empty" precondition. A changeSet whose precondition fails is recorded as MARK_RAN
  # and never reconsidered, so keying on emptiness would silently lose the rows forever - the
  # mistake 6_seed_organization_more.yml had to repair. Re-running this file is a no-op instead.

  - changeSet:
      id: seed-departments
      author: nam
      context: dev
      changes:
        # One row per department. `description` is nullable, so DEPT-008 leaves it NULL to make
        # sure the API is exercised with a missing optional field as well as a populated one.
        - sql:
            sql: >
              INSERT INTO departments (name, description, department_code, create_time, last_update_time)
              SELECT c.name, c.description, c.department_code, c.create_time, c.create_time
              FROM (
                        SELECT 'Finance'          AS name, 'Accounting, treasury and financial reporting' AS description, 'DEPT-001' AS department_code, '2024-01-15 08:00:00' AS create_time
                  UNION ALL SELECT 'Human Resources',      'Recruitment, payroll and employee relations',            'DEPT-002', '2024-01-15 08:00:00'
                  UNION ALL SELECT 'Information Technology','Infrastructure, internal systems and support',          'DEPT-003', '2024-02-01 09:15:00'
                  UNION ALL SELECT 'Sales',                'Direct sales and account management',                    'DEPT-004', '2024-03-02 09:30:00'
                  UNION ALL SELECT 'Marketing',            'Brand, campaigns and market research',                   'DEPT-005', '2024-03-02 09:30:00'
                  UNION ALL SELECT 'Operations',           'Production planning and day to day operations',          'DEPT-006', '2024-06-20 14:05:00'
                  UNION ALL SELECT 'Logistics',            'Warehousing, shipping and fleet',                        'DEPT-007', '2024-06-20 14:05:00'
                  UNION ALL SELECT 'Research and Development', NULL,                                                 'DEPT-008', '2025-02-10 11:45:00'
              ) AS c
              WHERE NOT EXISTS (
                  SELECT 1 FROM departments d WHERE d.department_code = c.department_code
              )
      rollback:
        - delete:
            tableName: departments
            where: department_code IN ('DEPT-001', 'DEPT-002', 'DEPT-003', 'DEPT-004', 'DEPT-005', 'DEPT-006', 'DEPT-007', 'DEPT-008')
